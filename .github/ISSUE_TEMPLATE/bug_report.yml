name: Bug report
description: Report a problem with Search Engine Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This repository accepts issue reports only — pull requests are not accepted.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Brief description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit (if known)
      placeholder: e.g. main @ abc1234
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python version, anything relevant
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, URLs, etc.
